<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-label="Pinger In-Page Side Panel and Alert Workflow Preview">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Browser Window -->
  <rect width="760" height="480" rx="14" fill="#0d121a" stroke="#253142" stroke-width="1.5" />
  <rect x="0" y="0" width="760" height="38" rx="14" fill="#141b26" />
  <rect x="0" y="24" width="760" height="14" fill="#141b26" />
  <circle cx="20" cy="19" r="5" fill="#ff6b6b" />
  <circle cx="38" cy="19" r="5" fill="#f0b429" />
  <circle cx="56" cy="19" r="5" fill="#3ecf8e" />
  <rect x="84" y="8" width="440" height="22" rx="6" fill="#0b1017" stroke="#253142" />
  <text x="98" y="23" fill="#8a9bb2" font-family="Consolas, monospace" font-size="11">https://noc-dashboard.internal/devices</text>

  <!-- Mock Network Inventory Table -->
  <g transform="translate(24, 58)">
    <text x="0" y="18" fill="#e8eef7" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Network Infrastructure Inventory</text>
    <rect x="0" y="34" width="390" height="232" rx="10" fill="#121822" stroke="#222e3f" />

    <!-- Header Row -->
    <rect x="0" y="34" width="390" height="32" rx="10" fill="#17202d" />
    <text x="16" y="54" fill="#8a9bb2" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">DEVICE</text>
    <text x="150" y="54" fill="#8a9bb2" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">IP ADDRESS</text>
    <text x="290" y="54" fill="#8a9bb2" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">STATUS</text>

    <!-- Row 1 (Selected IP + Chip) -->
    <text x="16" y="92" fill="#e8eef7" font-family="Consolas, monospace" font-size="12">core-router-01</text>
    <rect x="145" y="76" width="84" height="22" rx="4" fill="#2f81f7" fill-opacity="0.28" stroke="#2f81f7" stroke-opacity="0.7" />
    <text x="151" y="91" fill="#7ecfff" font-family="Consolas, monospace" font-size="12" font-weight="700">10.24.0.1</text>
    <text x="290" y="92" fill="#ff6b6b" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="600">● Offline</text>

    <!-- Floating Selection Chip -->
    <g transform="translate(148, 102)" filter="url(#shadow)">
      <rect x="0" y="0" width="106" height="24" rx="12" fill="#2f81f7" />
      <text x="10" y="16" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700">Pingle 10.24.0.1</text>
      <rect x="110" y="0" width="54" height="24" rx="12" fill="#2d3a4b" />
      <text x="119" y="16" fill="#e8eef7" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="600">Tracert</text>
      <rect x="168" y="0" width="40" height="24" rx="12" fill="#2d3a4b" />
      <text x="177" y="16" fill="#e8eef7" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="600">Port</text>
    </g>

    <!-- Row 2 -->
    <line x1="12" y1="142" x2="378" y2="142" stroke="#1e2938" />
    <text x="16" y="168" fill="#e8eef7" font-family="Consolas, monospace" font-size="12">edge-fw-02</text>
    <text x="150" y="168" fill="#c5d0dc" font-family="Consolas, monospace" font-size="12">192.168.10.254</text>
    <text x="290" y="168" fill="#3ecf8e" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="600">● Online</text>

    <!-- Row 3 -->
    <line x1="12" y1="186" x2="378" y2="186" stroke="#1e2938" />
    <text x="16" y="212" fill="#e8eef7" font-family="Consolas, monospace" font-size="12">dns-primary</text>
    <text x="150" y="212" fill="#c5d0dc" font-family="Consolas, monospace" font-size="12">1.1.1.1</text>
    <text x="290" y="212" fill="#3ecf8e" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="600">● Online</text>

    <!-- Row 4 -->
    <line x1="12" y1="230" x2="378" y2="230" stroke="#1e2938" />
    <text x="16" y="252" fill="#e8eef7" font-family="Consolas, monospace" font-size="12">branch-sw-04</text>
    <text x="150" y="252" fill="#c5d0dc" font-family="Consolas, monospace" font-size="12">172.16.40.12</text>
    <text x="290" y="252" fill="#3ecf8e" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="600">● Online</text>
  </g>

  <!-- Windows Recovery Toast Card (Bottom-Left) -->
  <g transform="translate(24, 344)" filter="url(#shadow)">
    <rect width="390" height="92" rx="10" fill="#141c27" stroke="#3ecf8e" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="28" cy="46" r="14" fill="#113328" />
    <text x="22" y="51" fill="#3ecf8e" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">✓</text>
    <text x="54" y="34" fill="#e8eef7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">Pinger — Recovery Alert</text>
    <text x="54" y="55" fill="#3ecf8e" font-family="Segoe UI, system-ui, sans-serif" font-size="12">10.24.0.1 tekrar cevap vermeye başladı</text>
    <text x="54" y="74" fill="#8a9bb2" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5">Triggered automatically after 3+ timeouts &amp; recovery</text>
  </g>

  <!-- Floating Draggable In-Page Side Panel (Right) -->
  <g transform="translate(438, 56)" filter="url(#shadow)">
    <rect width="300" height="398" rx="11" fill="#0b1017" stroke="#2f81f7" stroke-opacity="0.7" stroke-width="1.5" />

    <!-- Head -->
    <circle cx="18" cy="20" r="4" fill="#3ecf8e" />
    <text x="28" y="24" fill="#e8eef7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">Pinger</text>
    <rect x="74" y="13" width="32" height="15" rx="7.5" fill="#132540" stroke="#2f81f7" />
    <text x="81" y="24" fill="#58a6ff" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="700">v2.0</text>
    <text x="276" y="24" fill="#8a9bb2" font-family="Segoe UI, system-ui, sans-serif" font-size="16">×</text>

    <!-- Tabs -->
    <g transform="translate(12, 38)">
      <rect width="276" height="26" rx="6" fill="#131a24" stroke="#253142" />
      <rect x="3" y="3" width="66" height="20" rx="4" fill="#2f81f7" />
      <text x="22" y="17" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700">Ping</text>
      <text x="86" y="17" fill="#8a9bb2" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5">Tracert</text>
      <text x="158" y="17" fill="#8a9bb2" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5">Port</text>
      <text x="228" y="17" fill="#8a9bb2" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5">DNS</text>
    </g>

    <!-- Input -->
    <g transform="translate(12, 72)">
      <rect width="206" height="28" rx="6" fill="#131a24" stroke="#253142" />
      <text x="10" y="18" fill="#e8eef7" font-family="Consolas, monospace" font-size="12">10.24.0.1</text>
      <rect x="212" y="0" width="64" height="28" rx="6" fill="#1c3b6b" stroke="#2f81f7" />
      <text x="226" y="18" fill="#8fbaff" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">Başlat</text>
    </g>

    <!-- Mini Stats -->
    <g transform="translate(12, 108)">
      <rect x="0" y="0" width="88" height="24" rx="5" fill="#131a24" stroke="#253142" />
      <text x="10" y="16" fill="#f0b429" font-family="Consolas, monospace" font-size="10" font-weight="700">Kayıp: 30%</text>
      <rect x="94" y="0" width="88" height="24" rx="5" fill="#131a24" stroke="#253142" />
      <text x="106" y="16" fill="#c5d0dc" font-family="Consolas, monospace" font-size="10" font-weight="700">Ort: 6ms</text>
      <rect x="188" y="0" width="88" height="24" rx="5" fill="#131a24" stroke="#253142" />
      <text x="196" y="16" fill="#3ecf8e" font-family="Consolas, monospace" font-size="10" font-weight="700">Anlık: 5ms</text>
    </g>

    <!-- Mini Sparkline -->
    <g transform="translate(12, 140)">
      <rect width="276" height="44" rx="6" fill="#131a24" stroke="#253142" />
      <rect x="10" y="6" width="8" height="32" rx="1.5" fill="#ff6b6b" />
      <rect x="22" y="6" width="8" height="32" rx="1.5" fill="#ff6b6b" />
      <rect x="34" y="6" width="8" height="32" rx="1.5" fill="#ff6b6b" />
      <rect x="46" y="20" width="8" height="18" rx="1.5" fill="#3ecf8e" />
      <rect x="58" y="22" width="8" height="16" rx="1.5" fill="#3ecf8e" />
      <rect x="70" y="19" width="8" height="19" rx="1.5" fill="#3ecf8e" />
      <rect x="82" y="23" width="8" height="15" rx="1.5" fill="#3ecf8e" />
      <rect x="94" y="21" width="8" height="17" rx="1.5" fill="#3ecf8e" />
      <rect x="106" y="22" width="8" height="16" rx="1.5" fill="#3ecf8e" />
    </g>

    <!-- Log -->
    <g transform="translate(12, 192)">
      <rect width="276" height="162" rx="6" fill="#0d121a" stroke="#253142" />
      <text x="10" y="18" fill="#8a9bb2" font-family="Consolas, monospace" font-size="10">&gt; ping 10.24.0.1 -t</text>
      <text x="10" y="34" fill="#ff6b6b" font-family="Consolas, monospace" font-size="10">Request timed out.</text>
      <text x="10" y="49" fill="#ff6b6b" font-family="Consolas, monospace" font-size="10">Request timed out.</text>
      <text x="10" y="64" fill="#ff6b6b" font-family="Consolas, monospace" font-size="10">Request timed out.</text>
      <text x="10" y="79" fill="#ff6b6b" font-family="Consolas, monospace" font-size="10">[UYARI] 10.24.0.1 yanıt vermiyor!</text>
      <text x="10" y="96" fill="#3ecf8e" font-family="Consolas, monospace" font-size="10">Reply from 10.24.0.1: time=6ms</text>
      <text x="10" y="111" fill="#3ecf8e" font-family="Consolas, monospace" font-size="10">[KURTARILDI] 10.24.0.1 çevrimiçi</text>
      <text x="10" y="128" fill="#3ecf8e" font-family="Consolas, monospace" font-size="10">Reply from 10.24.0.1: time=5ms</text>
    </g>

    <!-- Bottom buttons -->
    <g transform="translate(12, 362)">
      <rect x="0" y="0" width="88" height="24" rx="5" fill="#18212e" stroke="#253142" />
      <text x="24" y="16" fill="#e8eef7" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="600">Durdur</text>
      <rect x="94" y="0" width="88" height="24" rx="5" fill="#18212e" stroke="#253142" />
      <text x="116" y="16" fill="#e8eef7" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="600">Kopyala</text>
      <rect x="188" y="0" width="88" height="24" rx="5" fill="#18212e" stroke="#253142" />
      <text x="208" y="16" fill="#e8eef7" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="600">Temizle</text>
    </g>
  </g>
</svg>
